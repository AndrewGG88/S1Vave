name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write       # the release
      id-token: write       # the signing certificate
      attestations: write   # the attestation
    with:
      build: BOARD=smk37 sh ./build.sh --release "${GITHUB_REF_NAME#v}" && BOARD=smk37 MODEL=elite sh ./build.sh --release "${GITHUB_REF_NAME#v}" && BOARD=smk37 MODEL=mke sh ./build.sh --release "${GITHUB_REF_NAME#v}" && sh ./build.sh --release "${GITHUB_REF_NAME#v}"
      packages: build/*.fwsc
